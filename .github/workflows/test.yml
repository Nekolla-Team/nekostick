name: Test

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "src/**"
      - "tests/**"
      - "deploy/**"
      - "*.slnx"
      - "global.json"
      - "Directory.*"
      - "NuGet.config"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "src/**"
      - "tests/**"
      - "deploy/**"
      - "*.slnx"
      - "global.json"
      - "Directory.*"
      - "NuGet.config"
  workflow_dispatch:
    inputs:
      test_macos:
        description: "Also run the macOS test job"
        required: false
        type: boolean
        default: false

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGDATABASE: nekostick_ci
  PGUSER: nekostick_ci
  PGPASSWORD: nekostick_ci_password
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  linux:
    name: Linux with Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # postgres:16
        env:
          POSTGRES_DB: nekostick_ci
          POSTGRES_USER: nekostick_ci
          POSTGRES_PASSWORD: nekostick_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nekostick_ci -d nekostick_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.100"

      - name: Verify PostgreSQL service health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if docker exec "${{ job.services.postgres.id }}" pg_isready -U "$PGUSER" -d "$PGDATABASE" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          printf '%s\n' 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Export isolated PostgreSQL test connection
        shell: bash
        run: |
          set -euo pipefail
          printf 'NEKOSTICK_TEST_PG=Host=%s;Port=%s;Database=%s;Username=%s;Password=%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$PGPASSWORD" >> "$GITHUB_ENV"

      - name: Restore canonical solution
        run: dotnet restore Nekolla.Nekostick.slnx --nologo

      - name: Build canonical solution
        run: dotnet build Nekolla.Nekostick.slnx --configuration Release --no-restore --verbosity quiet --nologo

      - name: Validate idempotent EF migration SQL
        shell: bash
        run: |
          set -euo pipefail
          script_path="$RUNNER_TEMP/Nekolla.Nekostick.idempotent-migrations.sql"
          repeat_script_path="$RUNNER_TEMP/Nekolla.Nekostick.idempotent-migrations.repeat.sql"
          ef_tool="$HOME/.nuget/packages/microsoft.entityframeworkcore.tools/10.0.11/tools/net8.0/any/ef.dll"
          test -f "$ef_tool"
          export NEKOSTICK_CONNECTION_STRING="$NEKOSTICK_TEST_PG"

          dotnet exec \
            --depsfile src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.deps.json \
            --runtimeconfig src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.runtimeconfig.json \
            "$ef_tool" migrations script --idempotent \
            --assembly src/Nekolla.Nekostick.Persistence/bin/Release/net10.0/Nekolla.Nekostick.Persistence.dll \
            --startup-assembly src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.dll \
            --project-dir src/Nekolla.Nekostick.Persistence \
            --configuration Release \
            --output "$script_path" \
            --no-color

          dotnet exec \
            --depsfile src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.deps.json \
            --runtimeconfig src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.runtimeconfig.json \
            "$ef_tool" migrations script --idempotent \
            --assembly src/Nekolla.Nekostick.Persistence/bin/Release/net10.0/Nekolla.Nekostick.Persistence.dll \
            --startup-assembly src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.dll \
            --project-dir src/Nekolla.Nekostick.Persistence \
            --configuration Release \
            --output "$repeat_script_path" \
            --no-color

          test -s "$script_path"
          cmp -s "$script_path" "$repeat_script_path"

      - name: Test canonical solution
        run: dotnet test Nekolla.Nekostick.slnx --configuration Release --no-build --no-restore --nologo --logger "console;verbosity=minimal"

      - name: Publish linux-x64 release artifact
        shell: bash
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/nekostick-linux-x64-publish"
          host_publish="$publish_root/host"
          rm -rf "$publish_root"

          # Host publish embeds the matching NativeHelper; publish no separate helper artifact.
          dotnet publish src/Nekolla.Nekostick.Host/Nekolla.Nekostick.Host.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained false \
            -p:PublishReadyToRun=true \
            -p:PublishSingleFile=true \
            --output "$host_publish" \
            --nologo

          test -x "$host_publish/Nekolla.Nekostick.Host"

      - name: Package linux-x64 workflow artifact
        shell: bash
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/nekostick-linux-x64-publish"
          host_publish="$publish_root/host"
          package_root="$RUNNER_TEMP/nekostick-linux-x64-artifact"
          archive_path="$RUNNER_TEMP/Nekolla.Nekostick-linux-x64.tar.gz"
          migration_script="$RUNNER_TEMP/Nekolla.Nekostick.idempotent-migrations.sql"
          verify_root="$RUNNER_TEMP/nekostick-linux-x64-artifact-verify"

          test -x "$host_publish/Nekolla.Nekostick.Host"
          test -s "$migration_script"
          rm -rf "$package_root" "$verify_root" "$archive_path" "$archive_path.sha256"
          mkdir -p "$package_root" "$verify_root"
          cp -a "$host_publish" "$package_root/host"
          cp "$migration_script" "$package_root/Nekolla.Nekostick.idempotent-migrations.sql"

          tar -C "$package_root" -czf "$archive_path" \
            host Nekolla.Nekostick.idempotent-migrations.sql
          (
            cd "$(dirname "$archive_path")"
            sha256sum "$(basename "$archive_path")" > "$(basename "$archive_path").sha256"
          )

          tar -xzf "$archive_path" -C "$verify_root"
          test -x "$verify_root/host/Nekolla.Nekostick.Host"
          test -s "$verify_root/Nekolla.Nekostick.idempotent-migrations.sql"
          test -s "$archive_path"
          test -s "$archive_path.sha256"

      - name: Upload linux-x64 workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nekostick-linux-x64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Nekolla.Nekostick-linux-x64.tar.gz
            ${{ runner.temp }}/Nekolla.Nekostick-linux-x64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS with Postgres 16
    if: github.event_name == 'workflow_dispatch' && inputs.test_macos
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.100"

      - name: Install and start PostgreSQL 16
        shell: bash
        run: |
          set -euo pipefail
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16
          echo "$(brew --prefix)/opt/postgresql@16/bin" >> "$GITHUB_PATH"
          brew services start postgresql@16

      - name: Verify PostgreSQL service health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if pg_isready -h "$PGHOST" -p "$PGPORT" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          printf '%s\n' 'PostgreSQL service did not become ready.' >&2
          exit 1

      - name: Create CI database role and database
        shell: bash
        run: |
          set -euo pipefail
          psql -U "$(whoami)" -h "$PGHOST" -p "$PGPORT" -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE \"$PGUSER\" LOGIN SUPERUSER PASSWORD '$PGPASSWORD';" \
            -c "CREATE DATABASE \"$PGDATABASE\" OWNER \"$PGUSER\";"

      - name: Export isolated PostgreSQL test connection
        shell: bash
        run: |
          set -euo pipefail
          printf 'NEKOSTICK_TEST_PG=Host=%s;Port=%s;Database=%s;Username=%s;Password=%s\n' \
            "$PGHOST" "$PGPORT" "$PGDATABASE" "$PGUSER" "$PGPASSWORD" >> "$GITHUB_ENV"

      - name: Restore canonical solution
        run: dotnet restore Nekolla.Nekostick.slnx --nologo

      - name: Build canonical solution
        run: dotnet build Nekolla.Nekostick.slnx --configuration Release --no-restore --verbosity quiet --nologo

      - name: Validate idempotent EF migration SQL
        shell: bash
        run: |
          set -euo pipefail
          script_path="$RUNNER_TEMP/Nekolla.Nekostick.idempotent-migrations.sql"
          repeat_script_path="$RUNNER_TEMP/Nekolla.Nekostick.idempotent-migrations.repeat.sql"
          ef_tool="$HOME/.nuget/packages/microsoft.entityframeworkcore.tools/10.0.11/tools/net8.0/any/ef.dll"
          test -f "$ef_tool"
          export NEKOSTICK_CONNECTION_STRING="$NEKOSTICK_TEST_PG"

          dotnet exec \
            --depsfile src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.deps.json \
            --runtimeconfig src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.runtimeconfig.json \
            "$ef_tool" migrations script --idempotent \
            --assembly src/Nekolla.Nekostick.Persistence/bin/Release/net10.0/Nekolla.Nekostick.Persistence.dll \
            --startup-assembly src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.dll \
            --project-dir src/Nekolla.Nekostick.Persistence \
            --configuration Release \
            --output "$script_path" \
            --no-color

          dotnet exec \
            --depsfile src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.deps.json \
            --runtimeconfig src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.runtimeconfig.json \
            "$ef_tool" migrations script --idempotent \
            --assembly src/Nekolla.Nekostick.Persistence/bin/Release/net10.0/Nekolla.Nekostick.Persistence.dll \
            --startup-assembly src/Nekolla.Nekostick.Host/bin/Release/net10.0/Nekolla.Nekostick.Host.dll \
            --project-dir src/Nekolla.Nekostick.Persistence \
            --configuration Release \
            --output "$repeat_script_path" \
            --no-color

          test -s "$script_path"
          cmp -s "$script_path" "$repeat_script_path"

      - name: Test canonical solution
        run: dotnet test Nekolla.Nekostick.slnx --configuration Release --no-build --no-restore --nologo --logger "console;verbosity=minimal"
