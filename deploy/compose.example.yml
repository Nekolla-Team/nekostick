services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  nekostick:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # The Host publish embeds NativeHelper; no helper artifact is mounted or copied.
    environment:
      NEKOSTICK_CONNECTION_STRING: ${NEKOSTICK_CONNECTION_STRING:?NEKOSTICK_CONNECTION_STRING must be set}
      NEKOSTICK_NODE_ID: ${NEKOSTICK_NODE_ID:?NEKOSTICK_NODE_ID must be set to a stable unique value}
      NEKOSTICK_LISTEN_ADDRESS: "0.0.0.0"
      NEKOSTICK_LISTEN_PORT: "8080"
    expose:
      - "8080"
    volumes:
      - ./extensions:/app/extensions:rw
      - ./data:/app/data:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:

networks:
  internal:
    internal: true
