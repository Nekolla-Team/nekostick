<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Nekostick dynamic routing host</title>
  <desc id="desc">A minimal diagram of Nekostick routing HTTP traffic to services, files, and extensions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1600" height="520" rx="24" fill="#f8fafc"/>
  <rect x="0" y="0" width="12" height="520" rx="6" fill="#0f766e"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="92" y="112" fill="#0f766e" font-size="15" font-weight="700" letter-spacing="2.5">DYNAMIC ROUTING HOST</text>
    <text x="92" y="178" fill="#0f172a" font-size="64" font-weight="750" letter-spacing="-2">Nekostick</text>
    <text x="96" y="226" fill="#64748b" font-size="17">.NET 10 / PostgreSQL 16</text>
  </g>

  <g fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M530 258H680"/>
    <path d="M1010 258H1092"/>
    <path d="M1092 145V371"/>
    <path d="M1092 145H1150"/>
    <path d="M1092 258H1150"/>
    <path d="M1092 371H1150"/>
  </g>
  <g fill="#0f766e">
    <circle cx="680" cy="258" r="5"/>
    <circle cx="1010" cy="258" r="5"/>
    <circle cx="1092" cy="145" r="5"/>
    <circle cx="1092" cy="258" r="5"/>
    <circle cx="1092" cy="371" r="5"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="430" y="231" width="100" height="54" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="480" y="264" text-anchor="middle" fill="#0f172a" font-size="16" font-weight="700">HTTP/1.1</text>

    <rect x="680" y="183" width="330" height="150" rx="16" fill="#0f172a"/>
    <rect x="710" y="242" width="32" height="32" rx="8" fill="#0f766e"/>
    <path d="M719 258h14M726 251v14" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="762" y="264" fill="#ffffff" font-size="24" font-weight="700">Nekostick Host</text>

    <g>
      <rect x="1150" y="112" width="360" height="66" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
      <rect x="1174" y="128" width="10" height="34" rx="5" fill="#0f766e"/>
      <text x="1206" y="151" fill="#0f172a" font-size="19" font-weight="700">Services</text>
    </g>
    <g>
      <rect x="1150" y="225" width="360" height="66" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
      <rect x="1174" y="241" width="10" height="34" rx="5" fill="#7c3aed"/>
      <text x="1206" y="264" fill="#0f172a" font-size="19" font-weight="700">Static files</text>
    </g>
    <g>
      <rect x="1150" y="338" width="360" height="66" rx="14" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
      <rect x="1174" y="354" width="10" height="34" rx="5" fill="#0284c7"/>
      <text x="1206" y="377" fill="#0f172a" font-size="19" font-weight="700">Extensions</text>
    </g>

  </g>
</svg>
